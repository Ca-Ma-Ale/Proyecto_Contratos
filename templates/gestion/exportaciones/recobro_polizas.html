{% extends 'base.html' %}

{% block title %}Exportar Recobro de Pólizas{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-4">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="display-5 mb-0">
                    <i class="fas fa-redo-alt text-success"></i> Recobro de Pólizas
                </h1>
                <a href="{% url 'gestion:exportaciones' %}" class="btn btn-volver-inicio">
                    <i class="fas fa-arrow-left"></i> Volver a Exportaciones
                </a>
            </div>
            <p class="text-muted mt-2">{{ descripcion }}</p>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header" style="background: linear-gradient(135deg, var(--avenida-green) 0%, var(--avenida-cyan) 100%); color: white;">
                    <h5 class="mb-0"><i class="fas fa-filter me-2"></i> Filtros de Exportación</h5>
                </div>
                <div class="card-body p-4">
                    <form method="GET" action="{% url 'gestion:exportar_recobro_polizas' %}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tipo de Contrato</label>
                            <select name="tipo_contrato" class="form-select">
                                <option value="">Todos</option>
                                <option value="CLIENTE">Cliente (Arrendamiento)</option>
                                <option value="PROVEEDOR">Proveedor</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tipo de Póliza</label>
                            <select name="tipo_poliza" class="form-select">
                                <option value="">Todas</option>
                                <option value="rce">RCE - Responsabilidad Civil</option>
                                <option value="cumplimiento">Cumplimiento</option>
                                <option value="arrendamiento">Póliza de Arrendamiento</option>
                                <option value="todo_riesgo">Todo Riesgo</option>
                                <option value="otra">Otras Pólizas</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Estado de Recobro</label>
                            <select name="recobro" class="form-select">
                                <option value="">Todos (con y sin recobro)</option>
                                <option value="si">Solo con Recobro</option>
                                <option value="no">Solo sin Recobro</option>
                            </select>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-file-excel me-2"></i> Generar Excel
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

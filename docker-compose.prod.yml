services:
  mysql:
    image: mysql:8.4
    container_name: proyecto-contratos-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: America/Bogota
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: proyecto-contratos-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default
      - web_proxy
    volumes:
      - ./deploy_data/media:/app/media
      - ./deploy_data/logs:/app/logs

networks:
  web_proxy:
    external: true

volumes:
  mysql_data:
